flavor: You imbue the weapon with churning earth.
earth-trait: Additional piercing damage from this weapon has the earth trait.
magic:
  label: Earth (Magic)
  description: >-
    **Type** Weapon


    **Parts** The monster must have the earth trait or an ability or spell with
    the earth trait.

    - - -

    **Effect** You imbue the weapon with churning earth.


    **Path** Magic; Choose when you first imbue the weapon for the granted
    spells to be either arcane or primal.

    - **2nd** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.zA0jNIBRgLsyTpbm]{Scatter Scree} as a
    cantrip, heightened to half the item's level rounded up.

    - **4th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.Rn2LkoSq1XhLsODV]{Pummeling Rubble}
    once per day.

    - **6th** The weapon's *pummeling rubble* heightens to 2nd rank.

    - **8th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.gPvtmKMRpg9I9D7H]{Earthbind} each per
    day.

    - **10th** Strikes with the weapon deal 1 additional piercing damage from
    spikes of stone; this additional damage has the earth trait.

    - **12th** The weapon's *earthbind* heightens to 4th rank, and the weapon
    can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.QiTHjk7DMecYFlrS]{Boulder
    Crush} and @UUID[Compendium.pf2e.spells-srd.Item.2BV2yYPfVJ5zirZt]{Mountain
    Resilience} once per day, but the weapon can no longer cast *pummeling
    rubble*.

    - **14th** The additional piercing damage increases to 1d4.

    - **16th** The weapon's *boulder crush*, *earthbind*, and *mountain
    resilience* heighten to 6th rank.

    - **18th** The additional piercing damage increases to 1d6.

    - **20th** The weapon's *mountain resilience* heightens to 8th rank, and it
    can cast @UUID[Compendium.pf2e.spells-srd.Item.x7SPrsRxGb2Vy2nu]{Earthquake}
    once per day.
  header:
    level-4-spells: >-
      The weapon can cast 1st rank
      @UUID[Compendium.pf2e.spells-srd.Item.Rn2LkoSq1XhLsODV]{Pummeling Rubble}
      once per day.
    level-6-spells: >-
      The weapon can cast 2nd rank
      @UUID[Compendium.pf2e.spells-srd.Item.Rn2LkoSq1XhLsODV]{Pummeling Rubble}
      once per day.
    level-8-spells: >-
      The weapon can cast 2nd rank
      @UUID[Compendium.pf2e.spells-srd.Item.Rn2LkoSq1XhLsODV]{Pummeling Rubble}
      and @UUID[Compendium.pf2e.spells-srd.Item.gPvtmKMRpg9I9D7H]{Earthbind}
      once per day each.
    level-12-spells: >-
      The weapon can cast 4th rank
      @UUID[Compendium.pf2e.spells-srd.Item.gPvtmKMRpg9I9D7H]{Earthbind}, 
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.QiTHjk7DMecYFlrS]{Boulder
      Crush} and
      @UUID[Compendium.pf2e.spells-srd.Item.2BV2yYPfVJ5zirZt]{Mountain
      Resilience} once per day each.
    level-16-spells: >-
      The weapon can cast 6th rank 
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.QiTHjk7DMecYFlrS]{Boulder
      Crush}, 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.gPvtmKMRpg9I9D7H]{Earthbind} and 6th
      rank @UUID[Compendium.pf2e.spells-srd.Item.2BV2yYPfVJ5zirZt]{Mountain
      Resilience} once per day each.
    level-20-spells: >-
      The weapon can cast 6th rank 
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.QiTHjk7DMecYFlrS]{Boulder
      Crush}, 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.gPvtmKMRpg9I9D7H]{Earthbind}, 8th
      rank @UUID[Compendium.pf2e.spells-srd.Item.2BV2yYPfVJ5zirZt]{Mountain
      Resilience} and
      @UUID[Compendium.pf2e.spells-srd.Item.x7SPrsRxGb2Vy2nu]{Earthquake} once
      per day each.
might:
  label: Earth (Might)
  description: >-
    **Type** Weapon


    **Parts** The monster must have the earth trait or an ability or spell with
    the earth trait.

    - - -

    **Effect** You imbue the weapon with churning earth.


    **Path** Might

    - **4th** Strikes with the weapon deal 1 additional piercing damage from
    spikes of stone; this additional damage has the earth trait.

    - **6th** The additional piercing damage increases to 1d4.

    - **8th** The additional piercing damage increases to 1d6. On a critical
    hit, the piercing rock shards attach the target's feet to the ground,
    forcing extra effort to break the rocks and move from its current space. As
    long as it was on the ground, its first 5 feet of movement are difficult
    terrain, typically preventing it from Stepping. This effect lasts until it
    moves or for 1 minute, whichever comes first.

    - **12th** The additional piercing damage dealt by this imbued property
    ignores resistances. Even if the main weapon deals piercing damage, this
    benefit only applies to the additional damage.

    - **14th** On a critical hit, the rocks connecting the creature to the
    ground fragment into damaging shards when the creature moves. If the
    creature breaks the rocks connecting it to the ground by moving, it takes an
    additional 1d8 piercing damage, which has the earth trait. If the creature
    instead chooses to wait the effect out for 1 minute without moving, it
    doesn't take the additional damage.

    - **18th** The additional piercing damage increases to 1d8.

    - **20th** On a successful Strike with the weapon, before applying the
    additional piercing damage, the target gains weakness 1 to earth until the
    beginning of your next turn.
  effects:
    level-8-difficult-terrain: >-
      On a critical hit, as long as the target was on the ground, its first 5
      feet of movement are difficult terrain, typically preventing it from
      Stepping. This effect lasts until it moves or for 1 minute, whichever
      comes first.
    level-12-resistance: >-
      The additional piercing damage dealt by this imbued property ignores
      resistances. Even if the main weapon deals piercing damage, this benefit
      only applies to the additional damage.
    level-14-difficult-terrain: >-
      On a critical hit, as long as the target was on the ground, its first 5
      feet of movement are difficult terrain, typically preventing it from
      Stepping. This effect lasts until it moves or for 1 minute, whichever
      comes first.

      If the creature breaks the rocks connecting it to the ground by moving, it
