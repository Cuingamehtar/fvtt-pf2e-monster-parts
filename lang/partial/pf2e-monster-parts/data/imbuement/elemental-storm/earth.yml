tech:
  label: Earth (Technique)
  description: >-
    **Type** Weapon


    **Parts** The monster must have the earth trait or an ability or spell with
    the earth trait.

    - - -

    **Effect** You imbue the weapon with churning earth.


    **Path** Technique

    - **4th** Strikes with the weapon deal 1 persistent piercing damage as stone
    spikes grow and pierce them; this additional damage has the earth trait.

    - **6th** Strikes with the weapon deal 1 additional piercing damage from
    spikes of stone; this additional damage has the earth trait.

    - **8th** The persistent piercing damage on a hit increases to 1d6. On a
    critical hit, the piercing rock shards attach the target's feet to the
    ground, forcing extra effort to move from its current space. As long as it
    was on the ground, its first 5 feet of movement are difficult terrain,
    typically preventing it from Stepping. This effect lasts until it moves or
    for 1 minute, whichever comes first.

    - **12th** The additional damage and persistent piercing damage dealt by
    this imbued property ignores resistances. Even if the main weapon deals
    piercing damage, this benefit only applies to the piercing damage from this
    imbued property.

    - **14th** The persistent piercing damage on a hit increases to 1d8.

    - **16th** While a target is suffering from the persistent piercing damage,
    the earth spikes growing on the target transform into an earthen shield that
    blocks their attacks against you. Whenever they hit you with a Strike, you
    gain resistance to physical damage (except adamantine) to that Strike with a
    value equal to the persistent piercing damage.

    - **18th** The persistent piercing damage on a hit increases to 1d10.

    - **20th** Foes suffering from the persistent piercing damage become
    partially petrified in their extremities, making fine movements difficult.
    They are @UUID[Compendium.pf2e.conditionitems.Item.i3OJZU2nk64Df3xm]{Clumsy 1} as long as they have the persistent piercing damage.
