      creature instead chooses to wait the effect out for 1 minute without
      moving, it doesn't take the additional damage.
    level-20-weakness: >-
      Before applying the additional piercing damage, the target gains weakness
      1 to earth until the beginning of your next turn.
      @UUID[Compendium.pf2e-monster-parts.activations-and-effects.Item.ezzdeD7d0ra6b3TX]{Effect:
