$basename: Wood
$item-type: Weapon
$parts: >-
  The monster must have the plant or wood trait or an ability or spell with the
  plant or wood trait.
flavor: You imbue the weapon with growing wood.
plant-trait: Additional piercing damage from this weapon has the plant trait.
weakness-label: Plant or Wood
magic:
  label: '{{$basename}} (Magic)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Magic; The spells granted by this imbued property are always
    primal.

    - **2nd** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.uZK2BYzPnxUBnDjr]{Tangle Vine} as a
    cantrip, heightened to half the item’s level rounded up.

    - **4th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree} once
    per day.

    - **6th** The weapon’s _protector tree_ heightens to 2nd rank.

    - **8th** The weapon’s _protector tree_ heightens to 3rd rank and it can
    cast @UUID[Compendium.pf2e.spells-srd.Item.J6vNvrUT3b1hx2iA]{Entangling
    Flora} once per day.

    - **10th** Strikes with the weapon deal 1 additional piercing damage from
    thorns and pointed branches; this additional damage has the plant trait.

    - **12th** The weapon’s _entangling flora_ and _protector tree_ heighten to
    4th rank and the weapon can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.7JgdSTJfI0arGAeF]{Autumn’s
    Howl} once per day.

    - **14th** The additional piercing damage increases to 1d4.

    - **16th** The weapon’s _autumn’s howl_ and _protector tree_ heighten to 6th
    rank and it can cast
    @UUID[Compendium.pf2e.spells-srd.Item.JbAcSLu62TU1OgNF]{Tangling Creepers}
    once per day but can no longer cast _entangling flora_.

    - **18th** The additional piercing damage increases to 1d6.

    - **20th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.Tc5NLaMu71vrGTJQ]{Nature’s Enmity}
    once per day.
  header:
    level-4-spells: >-
      The weapon can cast
      @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree}
      once per day.
    level-6-spells: >-
      The weapon can cast 2nd rank
      @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree}
      once per day.
    level-8-spells: >-
      The weapon can cast 3rd rank
      @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree}
      and @UUID[Compendium.pf2e.spells-srd.Item.J6vNvrUT3b1hx2iA]{Entangling
      Flora} once per day each.
    level-12-spells: >-
      The weapon can cast 4th rank
      @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree},
      4th rank
      @UUID[Compendium.pf2e.spells-srd.Item.J6vNvrUT3b1hx2iA]{Entangling Flora},
      and
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.7JgdSTJfI0arGAeF]{Autumn’s
      Howl} once per day each.
    level-16-spells: >-
      The weapon can cast 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.K9gI08enGtmih5X1]{Protector Tree},
      6th rank
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.7JgdSTJfI0arGAeF]{Autumn’s
      Howl}, and
      @UUID[Compendium.pf2e.spells-srd.Item.JbAcSLu62TU1OgNF]{Tangling Creepers}
      once per day each.
    level-20-natures-enmity: >-
      The weapon can cast
      @UUID[Compendium.pf2e.spells-srd.Item.Tc5NLaMu71vrGTJQ]{Nature's Enmity}
      once per day.
might:
  label: '{{$basename}} (Might)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Might

    - **4th** Strikes with the weapon deal 1 additional piercing damage from
    thorns and pointed branches; this additional damage has the plant trait.

    - **6th** The additional piercing damage increases to 1d4.

    - **8th** The additional piercing damage increases to 1d6. {{might.header.level-8-immobilized}}

    - **12th** {{might.header.level-12-resistance}}

    - **14th** On a critical hit with the weapon, if the target succeeds at
    their saving throw, they take a –20-foot circumstance penalty to their
    Speeds, instead of a –10-foot circumstance penalty.

    - **18th** The additional piercing damage increases to 1d8.

    - **20th** {{might.header.level-20-weakness}}
  effects:
    level-8-immobilized: >-
      On a critical hit, vines attempt to entangle the target; they must attempt
      a @Check[reflex|dc:resolve(item-level-dc)|options:inflicts:immobilized]
      save. On a failure, they’re immobilized, and on a success they take a
      –10-foot circumstance penalty to their Speeds. Either condition ends after
      1 round or if they spend an Interact action to remove the effect,
      whichever comes first.
    level-12-resistance: '{{might.header.level-12-resistance}}'
    level-14-immobilized: >-
      On a critical hit, vines attempt to entangle the target; they must attempt
      a @Check[reflex|dc:resolve(item-level-dc)|options:inflicts:immobilized]
      save. On a failure, they’re immobilized, and on a success they take a
      –20-foot circumstance penalty to their Speeds. Either condition ends after
      1 round or if they spend an Interact action to remove the effect,
      whichever comes first.
    level-20-weakness: >-
      {{might.header.level-20-weakness}}
      @UUID[Compendium.pf2e-monster-parts.activations-and-effects.Item.ezzdeD7d0ra6b3TX]{Effect:
      Might Path Damage Weakness}
  header:
    level-8-immobilized: >-
      On a critical hit, vines attempt to entangle the target; they must attempt
      a Reflex save against the weapon’s DC. On a failure, they’re immobilized,
      and on a success they take a –10-foot circumstance penalty to their
      Speeds. Either condition ends after 1 round or if they spend an Interact
      action to remove the effect, whichever comes first.
    level-12-resistance: >-
      The additional piercing damage dealt by this imbued property ignores
      resistances. Even if the main weapon deals piercing damage, this benefit
      only applies to the additional damage.
    level-14-immobilized: >-
      On a critical hit, vines attempt to entangle the target; they must attempt
      a Reflex save against the weapon’s DC. On a failure, they’re immobilized,
      and on a success they take a –20-foot circumstance penalty to their
      Speeds. Either condition ends after 1 round or if they spend an Interact
      action to remove the effect, whichever comes first.
    level-20-weakness: >-
      On a successful Strike with the weapon, before applying the additional
      piercing damage, the target gains weakness 1 to damage and effects with
      the plant or wood trait until the beginning of your next turn.
tech:
  label: '{{$basename}} (Technique)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Technique

    - **4th** Strikes with the weapon deal 1 persistent piercing damage as
    thorns and vines continue to sprout from within them; this additional damage
    has the plant trait.

    - **6th** Strikes with the weapon deal 1 additional piercing damage from
    thorns and pointed branches; this additional damage has the plant trait.

    - **8th** The persistent piercing damage on a hit increases to 1d6. {{might.header.level-8-immobilized}}

    - **12th** {{tech.header.level-12-resistance}}

    - **14th** The persistent piercing damage on a hit increases to 1d8.

    - **16th** Even on a normal hit, the vines on the target grow longer and
    impede their movement. They take a –5-foot circumstance penalty to their
    Speeds for 1 round, on until they spend an Interact action pulling off the
    vines to remove the effect, whichever comes first. On a successful Reflex
    save after a critical hit, the circumstance penalty increases to a –20-foot
    circumstance penalty.

    - **18th** The persistent bludgeoning damage on a hit increases to 1d10.

    - **20th** The pollen, spores, and seeds from the plants growing on your
    foes when they take the persistent piercing damage spreads between them,
    growing more and more plants. At the end of a foe’s turn, when they take
    damage from the imbued property’s persistent piercing damage, the plants
    spread to all foes adjacent to the foe not already sprouting plants, and
    they take the persistent piercing damage as well.
  effects:
    level-8-immobilized: '{{might.effects.level-8-immobilized}}'
    level-12-resistance: '{{tech.header.level-12-resistance}}'
    level-16-speed-penalty: >-
      The target takes a –5-foot circumstance penalty to their Speeds for 1
      round, on until they spend an Interact action pulling off the vines to
      remove the effect, whichever comes first.
    level-16-immobilized: '{{might.effects.level-14-immobilized}}'
    level-20-spread: '{{tech.header.level-20-spread}}'
  header:
    level-8-immobilized: '{{might.header.level-8-immobilized}}'
    level-12-resistance: >-
      The additional damage and persistent piercing damage dealt by this imbued
      property ignores resistances. Even if the main weapon deals piercing
      damage, this benefit only applies to the piercing damage from this imbued
      property.
    level-16-speed-penalty: >-
      The target takes a –5-foot circumstance penalty to their Speeds for 1
      round, on until they spend an Interact action pulling off the vines to
      remove the effect, whichever comes first.
    level-16-immobilized: '{{might.header.level-14-immobilized}}'
    level-20-spread: >-
      At the end of a foe’s turn, when they take
      damage from the imbued property’s persistent piercing damage, the plants
      spread to all foes adjacent to the foe not already sprouting plants, and
      they take the persistent piercing damage as well.
