$basename: Metal
$item-type: Weapon (the weapon must be made of metal and must deal bludgeoning, piercing, or slashing damage)
$parts: The monster must have the metal trait or an ability or spell that deals metal damage, or they must have a significant amount of metal in their composition.
$dev-note: >-
  There is no way to check if the item is made of metal.
  There is also no metal damage type in the system, so the following
  requirement is used instead: "_The monster must have the metal trait or an
  ability or spell with the metal trait_."
flavor: You imbue the weapon with the adaptive power of metal.
metal-trait: Additional damage from this weapon has the metal trait.
magic:
  label: "{{$basename}} (Magic)"
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}


    **Developer's note** {{$dev-note}}

    - - -

    **Effect** {{flavor}}


    **Path** Magic; Choose when you first imbue the weapon for the granted
    spells to be either arcane or primal.

    - **2nd** The weapon can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.xL4V10dh1RR1SL9o]{Cascading
    Caltrops} as a cantrip, heightened to half the item's level rounded up.

    - **4th** The weapon can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw}
    once per day.

    - **6th** The weapon can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.3UBaeKFOoYIb7TXt]{Reforge
    Weapon} once per day.

    - **8th** Strikes with the weapon deal 1 additional damage of the weapon’s
    normal damage type; even if the weapon has the concussive, modular, or
    versatile trait or a similar trait, the additional damage is based on the
    weapon’s normal damage type. The additional damage has the metal trait.

    - **10th** The weapon’s _reforge weapon_ heightens to 4th rank.

    - **12th** The weapon’s buzzsaw heightens to 3rd rank, and the weapon can
    cast @UUID[Compendium.pf2e.spells-srd.Item.oXeEbcUdgJGWHGEJ]{Impaling Spike}
    once per day.

    - **14th** The additional damage increases to 1d4.

    - **16th** The weapon’s _buzzsaw_, _impaling spike_, and _reforge weapon_
    heighten to 6th rank.

    - **18th** The additional damage increases to 1d6.

    - **20th** The weapon can cast
    @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.Q3n4eIJTb6kSf3jE]{Iron
    Deathtrap} once per day.
  header:
    level-4-spells: >-
      The weapon can cast
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw}
      once per day.
    level-6-spells: >-
      The weapon can cast
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw}
      and
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.3UBaeKFOoYIb7TXt]{Reforge
      Weapon} once per day each.
    level-10-spells: >-
      The weapon can cast
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw}
      and 4th rank
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.3UBaeKFOoYIb7TXt]{Reforge
      Weapon} once per day each.
    level-12-spells: >-
      The weapon can cast 3rd rank
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw},
