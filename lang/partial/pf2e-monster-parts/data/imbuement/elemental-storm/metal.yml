might:
  label: "{{$basename}} (Might)"
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}


    **Developer's note** {{$dev-note}}

    - - -

    **Effect** {{flavor}}


    **Path** Might

    - **4th** Strikes with the weapon deal 1 additional damage of the weapon’s
    normal damage type; even if the weapon has the concussive, modular, or
    versatile trait or a similar trait, the additional damage is based on the
    weapon’s normal damage type. The additional damage has the metal trait.

    - **6th** The additional damage increases to 1d4.

    - **8th** The additional damage increases to 1d6. On a critical hit, both
    the weapon and the imbued property deal whichever of bludgeoning, piercing,
    or slashing damage would be most effective and you can choose to change the
    weapon’s damage type and your metal imbued properties’ damage type to the
    new damage type until the end of your next turn.

    - **12th** The damage dealt by this imbued property ignores resistances;
    this only applies to the damage from the imbued property, not the weapon’s
    normal damage.

    - **14th** On a critical hit, the weapon counts as whichever of cold iron or
    silver would be more beneficial against the target, and you can choose to
    have it continue to count as that precious metal until the end of your next
    turn.

    - **18th** The additional damage increases to 1d8.

    - **20th** On a successful Strike with the weapon, before applying the
    additional damage, the target gains weakness 1 to metal until the beginning
    of your next turn.
