    level-16-spells: >-
      The weapon can cast 6th rank
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.hwIHGfWvSJJVMJN6]{Buzzsaw},
      6th rank
      @UUID[Compendium.battlezoo-bestiary-es-pf2e.spells.Item.3UBaeKFOoYIb7TXt]{Reforge
      Weapon}, and 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.oXeEbcUdgJGWHGEJ]{Impaling Spike}
      once per day each.
    level-20-iron-deathtrap: >-
      The weapon can cast
