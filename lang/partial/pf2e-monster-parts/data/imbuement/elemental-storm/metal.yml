tech:
  label: "{{$basename}} (Technique)"
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}


    **Developer's note** {{$dev-note}}

    - - -

    **Effect** {{flavor}}


    **Path** Technique

    - **4th** Strikes with the weapon deal 1 persistent piercing damage by
    leaving behind jagged shards of metal. The persistent damage has the metal
    trait.

    - **6th** Strikes with the weapon deal 1 additional damage of the weapon’s
    normal damage type; even if the weapon has the concussive, modular, or
    versatile trait or a similar trait, the additional damage is based on the
    weapon’s normal damage type. The additional damage has the metal trait.

    - **8th** The persistent damage increases to 1d6. On a critical hit, both
    the weapon and the imbued property deal whichever of bludgeoning, piercing,
    or slashing damage would be most effective and you can choose to change the
    weapon’s damage type and your metal imbued properties’ damage type to the
    new damage type until the end of your next turn.

    - **12th** The damage dealt by this imbued property (including persistent
    damage) ignores resistances. This only applies to the damage from the imbued
    property, not the weapon’s normal damage.

    - **14th** The persistent damage on a hit increases to 1d8.

    - **16th** The persistent damage from the imbued property absorbs metals
    harmful to the foe. If the foe takes damage from a weakness to a specific
    type of metal (such as adamantine, cold iron, silver, and so on) while
    suffering from the imbued property’s persistent damage, the persistent
    damage absorbs that metal into its piercing shards and continues to deal
    damage of that type of metal until the foe removes the persistent damage.

    - **18th** The persistent damage on a hit increases to 1d10.

    - **20th** The metal shards within a foe’s body change and adapt, becoming
    harder and harder to remove over time. At the end of a creature’s turn, if
    they fail to remove the persistent damage from the imbued property, the DC
    to remove the persistent damage increases by 1, to a maximum of five
    increases raising the flat check DC to 20 (or 15 with especially effective
    assistance).
  effects:
    level-8-effective: >-
      On a critical hit, both the weapon and the imbued property deal whichever
      of bludgeoning, piercing, or slashing damage would be most effective and
      you can choose to change the weapon’s damage type and your metal imbued
      properties’ damage type to the new damage type until the end of your next
      turn.
    level-12-resistance: >-
      The damage dealt by this imbued property (including persistent damage)
      ignores resistances. This only applies to the damage from the imbued
      property, not the weapon’s normal damage.
    level-16-material: >-
      The persistent damage from the imbued property absorbs metals harmful to
      the foe. If the foe takes damage from a weakness to a specific type of
      metal (such as adamantine, cold iron, silver, and so on) while suffering
      from the imbued property’s persistent damage, the persistent damage
      absorbs that metal into its piercing shards and continues to deal damage
      of that type of metal until the foe removes the persistent damage.
    level-20-dc: >-
      The metal shards within a foe’s body change and adapt, becoming harder and
      harder to remove over time. At the end of a creature’s turn, if they fail
      to remove the persistent damage from the imbued property, the DC to remove
      the persistent damage increases by 1, to a maximum of five increases
      raising the flat check DC to 20 (or 15 with especially effective
      assistance).
