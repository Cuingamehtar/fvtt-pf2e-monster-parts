$basename: Spirit
$item-type: Weapon
$parts: >-
  The monster must have the spirit trait or an ability or spell that
  deals spirit damage.
flavor: You imbue the weapon with the ephemeral nature of the spirit. All spells and spirit damage from this imbued property never gain
  the holy or unholy trait, even if they would normally be sanctified.
magic:
  label: '{{$basename}} (Magic)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Magic; Choose when you first imbue the weapon for the granted
    spells to be either divine or occult.

    - **2nd** The weapon can cast @Spell[DivineLance]{Divine Lance} as a cantrip, heightened to
    half the item’s level rounded up.

    - **4th** The weapon can cast @Spell[SpiritLink]{Spirit Link} once per day.

    - **6th** The weapon can cast 2nd-rank _spirit link_ or @Spell[SpiritualArmament]{Spiritual Armament} once per day, but not both.

    - **8th** The weapon can cast both _spirit link_ and _spiritual armament_ once per day and _spirit link_ heightens to 3rd rank.

    - **10th** All damage from Strikes with the weapon harm incorporeal creatures with weakness to _ghost touch_ or resistances bypassed by _ghost touch_.

    - **12th** The weapon’s _spiritual armament_ heighten to 4th rank, and the weapon can cast @Spell[SpiritualGuardian]{Spiritual Guardian} once per day.

    - **14th** Strikes with the weapon deal 1 additional spirit damage.

    - **16th** The weapon’s _spirit link_ heightens to 5th rank, its _spiritual guardian_ heightens to 6th rank, and the weapon can cast @Spell[SpiritBlast]{Spirit Blast} once per day, but the weapon can no longer cast _spiritual armament_.

    - **18th** The additional spirit damage increases to 1d4.

    - **20th** The weapon can cast 9th-rank @Spell[SpiritSong]{Spirit Song} once per day.
  header:
    level-4-spells: >-
      The weapon can cast @Spell[SpiritLink]{Spirit Link} once per day.
    level-6-spells: >-
      The weapon can cast 2nd rank @Spell[SpiritLink]{Spirit Link} or @Spell[SpiritualArmament]{Spiritual Armament} once per day, but not both.
    level-8-spells: >-
      The weapon can cast 3rd rank @Spell[SpiritLink]{Spirit Link} or @Spell[SpiritualArmament]{Spiritual Armament}
      once per day each.
    level-12-spells: >-
      The weapon can cast 4th rank @Spell[SpiritLink]{Spirit Link}, @Spell[SpiritualArmament]{Spiritual Armament}, and @Spell[SpiritualGuardian]{Spiritual Guardian}
      once per day each.
    level-16-spells: >-
      The weapon can cast 5th rank @Spell[SpiritLink]{Spirit Link}, 6th-rank @Spell[SpiritualGuardian]{Spiritual Guardian}, and @Spell[SpiritBlast]{Spirit Blast}
      once per day each.
    level-20-spirit-song: >-
      The weapon can cast 9th rank @Spell[SpiritSong]{Spirit Song} once per day.
might:
  label: '{{$basename}} (Might)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Might

    - **4th** {{might.header.level-4-ghost-touch}}.

    - **6th** Strikes with the weapon deal 1 additional spirit damage.

    - **8th** The additional spirit damage increases to 1d4 and Strikes
    made with the weapon against a possessing creature don’t
    harm the possessed creature. On a critical hit against a creature
    possessing another creature, the possessing creature must
    succeed at a Will save against the weapon’s DC or be expelled
    and unable to possess a creature for 1d4 rounds.

    - **12th** {{might.effects.level-12-resistance}}

    - **14th** The additional spirit damage increases to 1d6.

    - **18th** {{might.effects.level-18-frightened}}

    - **20th** {{might.header.level-20-weakness}}
  effects:
    level-8-possessed: >-
      Strikes made with the weapon against a possessing creature don’t harm the possessed creature.
    level-8-possessed-critical: >-
      On a critical hit against a creature possessing another creature, the possessing creature must succeed at a @Check[will|dc:resolve(item-level-dc)] save against the weapon’s DC or be expelled and unable to possess a creature for 1d4 rounds.
    level-12-resistance: >-
      The spirit damage dealt by this imbued property ignores resistances.
    level-18-frightened: >-
      On a critical hit against a possessing creature, the dissonant spirit energy causes the possessing creature to become frightened 1, whether it succeeds at its Will save or not.
    level-20-weakness: >-
      {{might.header.level-20-weakness}}
      @UUID[Compendium.pf2e-monster-parts.activations-and-effects.Item.ezzdeD7d0ra6b3TX]{Effect:
      Might Path Damage Weakness}
  header:
    level-4-ghost-touch: >-
      All damage from Strikes with the weapon harm incorporeal
      creatures with weakness to _ghost touch_ or resistances bypassed
      by _ghost touch_.
    level-8-possessed: '{{might.effects.level-8-possessed}} {{might.effects.level-8-possessed-critical}}'
    level-12-resistance: '{{might.effects.level-12-resistance}}'
    level-18-frightened: '{{might.effects.level-18-frightened}}'
    level-20-weakness: >-
      On a successful Strike with the weapon, before applying spirit damage, the target gains weakness 1 to spirit until the beginning of your next turn.
tech:
  label: '{{$basename}} (Technique)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Technique

    - **4th** {{might.header.level-4-ghost-touch}}

    - **6th** Strikes with the weapon deal 1 persistent spirit damage by
    leaving behind spiritual strands to constrict the target’s spirit.

    - **8th** The persistent spirit damage increases to 1d6. On a critical hit
    against a creature possessing another creature, the possessing
    creature must succeed at a Will save against the weapon’s DC
    or be expelled and unable to possess a creature for 1d4 rounds.

    - **12th** {{tech.effects.level-12-resistance}}

    - **14th** The persistent spirit damage on a hit increases to 1d8.

    - **16th** {{might.effects.level-18-frightened}}

    - **18th** The persistent spirit damage on a hit increases to 1d10.

    - **20th** {{tech.effects.level-20-quasi-corporeal}}
  effects:
    level-8-possessed-critical: '{{might.effects.level-8-possessed-critical}}'
    level-12-resistance: >-
      The spirit damage dealt by this imbued property (including
      persistent spirit damage) ignores resistances.
    level-16-frightened: '{{might.effects.level-18-frightened}}'
    level-20-quasi-corporeal: >-
      The persistent spirit damage causes a creature suffering from it
          to become quasi-corporeal as long as the persistent spirit damage
          lasts. While quasi-corporeal, an incorporeal creature reduces their
          resistance to all damage by half, doesn’t double their resistance
          against nonmagical effects, loses their immunity to precision
          damage, and can make and be affected by Strength-based skill
          checks. On the other hand, a corporeal creature that becomes
          quasi-corporeal doesn’t prevent corporeal creatures from moving
          through its space (though it still can’t move through a corporeal
          creature’s space) and takes a –2 status penalty to Athletics checks.
  header:
    level-4-ghost-touch: '{{might.header.level-4-ghost-touch}}'
    level-8-possessed-critical: '{{might.effects.level-8-possessed-critical}}'
    level-12-resistance: '{{tech.effects.level-12-resistance}}'
    level-16-frightened: '{{might.effects.level-18-frightened}}'
    level-20-quasi-corporeal: '{{tech.effects.level-20-quasi-corporeal}}'
