$basename: Water
$item-type: Weapon
$parts: >-
  The monster must have the water trait or an ability or spell with the water
  trait.
flavor: You imbue the weapon with flowing water.
water-trait: Additional bludgeoning damage from this weapon has the water trait.
magic:
  label: '{{$basename}} (Magic)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Magic; Choose when you first imbue the weapon for the granted
    spells to be either arcane or primal.

    - **2nd** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.eSL5hVT9gXrnRLtd]{Spout} as a cantrip,
    heightened to half the item’s level rounded up.

    - **4th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push} once
    per day.

    - **6th** The weapon’s _hydraulic push_ heightens to 2nd rank.

    - **8th** The weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.T4QKmtYPeCgYxVGe]{Crashing Wave} once
    per day.

    - **10th** Strikes with the weapon deal 1 additional bludgeoning damage from
    a crashing wave of water; this additional damage has the water trait.

    - **12th** The weapon’s _crashing wave_ and _hydraulic push_ spells heighten
    to 4th rank and the weapon can cast
    @UUID[Compendium.pf2e.spells-srd.Item.Y3G6Y6EDgCY0s3fq]{Hydraulic Torrent}
    once per day.

    - **14th** The additional bludgeoning damage increases to 1d4.

    - **16th** The weapon’s _crashing wave_, _hydraulic push_, and _hydraulic
    torrent_ heighten to 6th rank.

    - **18th** The additional bludgeoning damage increases to 1d6.

    - **20th** The weapon can cast 9th-rank
    @UUID[Compendium.pf2e.spells-srd.Item.M0jQlpQYUr0pp2Sv]{Desiccate} once per
    day.
  header:
    level-4-spells: >-
      The weapon can cast
      @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push}
      once per day.
    level-6-spells: >-
      The weapon can cast 2nd rank
      @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push}
      once per day.
    level-8-spells: >-
      The weapon can cast 2nd rank
      @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push}
      and @UUID[Compendium.pf2e.spells-srd.Item.T4QKmtYPeCgYxVGe]{Crashing Wave}
      once per day each.
    level-12-spells: >-
      The weapon can cast 4th rank
      @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push},
      4th rank @UUID[Compendium.pf2e.spells-srd.Item.T4QKmtYPeCgYxVGe]{Crashing
      Wave}, and
      @UUID[Compendium.pf2e.spells-srd.Item.Y3G6Y6EDgCY0s3fq]{Hydraulic Torrent}
      once per day each.
    level-16-spells: >-
      The weapon can cast 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.jfVCuOpzC6mUrf6f]{Hydraulic Push},
      6th rank @UUID[Compendium.pf2e.spells-srd.Item.T4QKmtYPeCgYxVGe]{Crashing
      Wave}, and 6th rank
      @UUID[Compendium.pf2e.spells-srd.Item.Y3G6Y6EDgCY0s3fq]{Hydraulic Torrent}
      once per day each.
    level-20-desiccate: >-
      The weapon can cast
      @UUID[Compendium.pf2e.spells-srd.Item.M0jQlpQYUr0pp2Sv]{Desiccate} once
      per day.
might:
  label: '{{$basename}} (Might)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Might

    - **4th** Strikes with the weapon deal 1 additional bludgeoning damage from
    a crashing wave of water; this additional damage has the water trait.

    - **6th** The additional bludgeoning damage increases to 1d4.

    - **8th** The additional bludgeoning damage increases to 1d6. On a critical
    hit, the target is also knocked prone by the force of the rushing wave
    unless it succeeds at a Fortitude save against the weapon’s DC.

    - **12th** The additional bludgeoning damage dealt by this imbued property
    ignores resistances. Even if the main weapon deals bludgeoning damage, this
    benefit only applies to the additional damage.

    - **14th** On a critical hit with the weapon, if the target is knocked
    prone, they take 3d6 bludgeoning damage from the hard and sudden landing.

    - **18th** The additional bludgeoning damage increases to 1d8.

    - **20th** On a successful Strike with the weapon, before applying the
    additional bludgeoning damage, the target gains weakness 1 to water until
    the beginning of your next turn.
  effects:
    level-8-prone: >-
      On a critical hit, the target is also knocked prone unless it succeeds at
      a @Check[fortitude|dc:resolve(item-level-dc)|options:inflicts:prone] save.
    level-12-resistance: >-
      The additional bludgeoning damage dealt by this imbued property ignores
      resistances. Even if the main weapon deals bludgeoning damage, this
      benefit only applies to the additional damage.
    level-14-prone: >-
      On a critical hit, the target is also knocked prone and takes
      @Damage[3d6[bludgeoning]] damage unless it succeeds at a
      @Check[fortitude|dc:resolve(item-level-dc)|options:inflicts:prone] save.
    level-20-weakness: >-
      Before applying the additional bludgeoning damage, the target gains
      weakness 1 to water until the beginning of your next turn.
      @UUID[Compendium.pf2e-monster-parts.activations-and-effects.Item.ezzdeD7d0ra6b3TX]{Effect:
      Might Path Damage Weakness}
  header:
    level-8-prone: >-
      On a critical hit, the target is also knocked prone by the force of the
      rushing wave unless it succeeds at a Fortitude save against the weapon’s
      DC.
    level-12-resistance: >-
      The additional bludgeoning damage dealt by this imbued property ignores
      resistances. Even if the main weapon deals bludgeoning damage, this
      benefit only applies to the additional damage.
    level-14-prone: >-
      On a critical hit, the target is also knocked prone by the force of the
      rushing wave and takes 3d6 bludgeoning damage unless it succeeds at a
      Fortitude save against the weapon’s DC.
    level-20-weakness: >-
      On a successful Strike with the weapon, before applying the additional
      bludgeoning damage, the target gains weakness 1 to water until the
      beginning of your next turn.
tech:
  label: '{{$basename}} (Technique)'
  description: >-
    **Type** {{$item-type}}


    **Parts** {{$parts}}

    - - -

    **Effect** {{flavor}}


    **Path** Technique

    - **4th** Strikes with the weapon deal 1 persistent bludgeoning damage as
    torrents of water continue to pummel them; this additional damage has the
    water trait.

    - **6th** Strikes with the weapon deal 1 additional bludgeoning damage from
    a crashing wave of water; this additional damage has the water trait.

    - **8th** The persistent bludgeoning damage on a hit increases to 1d6. On a
    critical hit, the target is also knocked prone by the force of the enormous
    wave unless it succeeds at a Fortitude save against the weapon’s DC.

    - **12th** The additional damage and persistent bludgeoning damage dealt by
    this imbued property ignores the target’s resistances. Even if the main
    weapon deals bludgeoning damage, this benefit only applies to the
    bludgeoning damage from this imbued property.

    - **14th** The persistent bludgeoning damage dealt on a hit increases to
    1d8.

    - **16th** While suffering from the persistent bludgeoning damage, the
    target is drenched in water, potentially making their footing slippery. Each
    turn, they must succeed at a Reflex save against the weapon’s DC, or else
    everywhere they walk, the ground is difficult terrain for them.

    - **18th** The persistent bludgeoning damage on a hit increases to 1d10.

    - **20th** Foes suffering from the persistent bludgeoning damage from this
    imbued property have difficulty speaking as long as they have the persistent
    bludgeoning damage, as the sloshing waves pour into their mouth whenever it
    opens. Unless they can breathe underwater or don’t need to breathe, they
    must succeed at a DC 5 flat check every time they use an action with the
    linguistic trait or cast a spell without the subtle trait or the action or
    spell is disrupted.
  effects:
    level-8-prone: '{{might.effects.level-8-prone}}'
    level-12-resistance: >-
      The additional damage and persistent bludgeoning damage dealt by this
      imbued property ignores the target’s resistances. Even if the main weapon
      deals bludgeoning damage, this benefit only applies to the bludgeoning
      damage from this imbued property.
    level-16-difficult-terrain: >-
      While suffering from the persistent bludgeoning damage, each turn, the
      target must succeed at a @Check[reflex|dc:resolve(item-level-dc)] save, or else
      everywhere they walk, the ground is difficult terrain for them.
    level-20-flat-check: >-
      Unless they can breathe underwater or don’t need to breathe, foes
      suffering from the persistent bludgeoning damage from this imbued property
      must succeed at a @Check[flat|dc:5|showDC:all] every time they use an
      action with the linguistic trait or cast a spell without the subtle trait
      or the action or spell is disrupted.
  header:
    level-8-prone: '{{might.header.level-8-prone}}'
    level-12-resistance: '{{tech.effects.level-12-resistance}}'
    level-16-difficult-terrain: >-
      While suffering from the persistent bludgeoning damage, the target is
      drenched in water, potentially making their footing slippery. Each turn,
      they must succeed at a Reflex save against the weapon’s DC, or else
      everywhere they walk, the ground is difficult terrain for them.
    level-20-flat-check: >-
      Foes suffering from the persistent bludgeoning damage from this imbued
      property have difficulty speaking as long as they have the persistent
      bludgeoning damage, as the sloshing waves pour into their mouth whenever
      it opens. Unless they can breathe underwater or don’t need to breathe,
      they must succeed at a DC 5 flat check every time they use an action with
      the linguistic trait or cast a spell without the subtle trait or the
      action or spell is disrupted.
