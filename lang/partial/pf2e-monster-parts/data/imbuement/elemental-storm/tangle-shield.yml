label: Tangle Shield
$flavor: >-
  You imbue your shield with the elemental power of wood to entangle and ensnare
  your foes.
description: >-
  **Type** Shield


  **Parts** The creature must have the plant or wood trait or have an ability or
  spell with the plant or wood trait.

  - - -

  **Effect** {{$flavor}}

  - **4th** Whenever you Shield Block a foe’s melee attack, choose one of the
  triggering foe’s squares or a square adjacent to that foe. Tangled vines or
  other plants fly off the shield from the impact of the Shield Block and land
  on the ground in that space, causing it to become difficult terrain until the
  end of the triggering creature’s next turn.

  - **6th** On a Shield Block, you choose up to two of the triggering foe’s
  squares or squares adjacent to that foe to place the difficult terrain,
  instead of one, these squares must be contiguous.

  - **8th** The plants can fly almost impossibly far; you can create difficult
  terrain when you Shield Block a ranged attack and not just a melee attack.

  - **10th** The difficult terrain you create when you Shield Block a foe’s
  attack lasts for 1d4+1 rounds.

  - **12th** On a Shield Block, you choose up to four of the triggering foe’s
  squares or squares adjacent to that foe to place the difficult terrain,
  instead of two, these squares must be contiguous.

  - **14th** When you Raise a Shield, you can choose to make some or all of the
  squares adjacent to you and on the ground difficult terrain, as entangling
  plants rise up to impede those squares; this difficult terrain lasts as long
  as you remain adjacent and your shield remains raised.

  - **16th** On a Shield Block, you choose up to nine of the triggering foe’s
  squares or squares adjacent to that foe to place the difficult terrain,
  instead of four (for a Medium creature, that means you can fill a creature’s
  space and all adjacent squares), these squares must be contiguous.

  - **18th** Difficult terrain from your Shield Block lasts for 1 minute.

  - **20th** You don’t need to remain adjacent to maintain the difficult terrain
  when you Raise a Shield, allowing you to create difficult terrain in adjacent
  spaces as you move along the ground. Difficult terrain you create in that way
  that isn’t adjacent to you lasts until the beginning of your next turn at
  most, even if you never stop Raising your Shield.
header:
  flavor: '{{$flavor}}'
  level-4-shield-block: >-
    Whenever you Shield Block a foe’s melee attack, choose one of the triggering
    foe’s squares or their adjacent squares. The square becomes  difficult
    terrain until the end of the triggering creature’s next turn.
  level-6-shield-block: >-
    Whenever you Shield Block a foe’s melee attack, choose two of the triggering
    foe’s squares or their adjacent squares. The squares become  difficult
    terrain until the end of the triggering creature’s next turn.
  level-8-shield-block: >-
    Whenever you Shield Block a foe’s melee or ranged attack, choose two of the
    triggering foe’s squares or their adjacent squares; the squares must be
    contiguous. The squares become difficult terrain until the end of the
    triggering creature’s next turn.
  level-10-shield-block: >-
    Whenever you Shield Block a foe’s melee or ranged attack, choose two of the
    triggering foe’s squares or their adjacent squares; the squares must be
    contiguous. The squares become difficult terrain for [[/r 1d4+1]] turns.
  level-12-shield-block: >-
    Whenever you Shield Block a foe’s melee or ranged attack, choose four of the
    triggering foe’s squares or their adjacent squares; the squares must be
    contiguous. The squares become difficult terrain for [[/r 1d4+1]] turns.
  level-14-raise-shield: >-
    When you Raise a Shield, you can choose to make some or all of the squares
    adjacent to you and on the ground difficult terrain. This difficult terrain
    lasts as long as you remain adjacent and your shield remains raised.
  level-16-shield-block: >-
    Whenever you Shield Block a foe’s melee or ranged attack, choose nine of the
    triggering foe’s squares or their adjacent squares; the squares must be
    contiguous. The squares become difficult terrain for [[/r 1d4+1]] turns.
  level-18-shield-block: >-
    Whenever you Shield Block a foe’s melee or ranged attack, choose nine of the
    triggering foe’s squares or their adjacent squares; the squares must be
    contiguous. The squares become difficult terrain for 1 minute.
  level-20-raise-shield: >-
    When you Raise a Shield, you can choose to make some or all of the squares
    adjacent to you and on the ground difficult terrain. You don’t need to
    remain adjacent to maintain the difficult terrain when you Raise a Shield,
    allowing you to create difficult terrain in adjacent spaces as you move
    along the ground. Difficult terrain you create in that way that isn’t
    adjacent to you lasts until the beginning of your next turn at most, even if
    you never stop Raising your Shield.
